root = "."
tmp_dir = "tmp"

[build]
cmd = "CGO_ENABLED=0 go build -o ./tmp/sandboxd ./cmd/api"
bin = "./tmp/sandboxd"
delay = 1000
exclude_dir = ["tmp", "vendor", ".git", ".gocache"]
exclude_file = []
exclude_regex = ["_test\\.go"]
include_dir = ["cmd", "internal", "web"]
include_ext = ["go", "tpl", "tmpl", "html", "js", "css", "svg"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[color]
app = "blue"
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false

[misc]
clean_on_exit = true
