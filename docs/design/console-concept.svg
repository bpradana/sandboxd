<text x="393" y="362" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7">/root</text>
<text x="393" y="386" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7"></text>
<text x="393" y="410" font-family="Menlo, monospace" font-size="13" fill="#b3ebbc">root@sandbox:~# mkdir -p /workspace &amp;&amp; cd /workspace</text>
<text x="393" y="434" font-family="Menlo, monospace" font-size="13" fill="#b3ebbc">root@sandbox:/workspace# python3 --version</text>
<text x="393" y="458" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7">Python 3.13.5</text>
<text x="393" y="482" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7"></text>
<text x="393" y="506" font-family="Menlo, monospace" font-size="13" fill="#b3ebbc">root@sandbox:/workspace# ls -la</text>
<text x="393" y="530" font-family="Menlo, monospace" font-size="13" fill="#99a5a3">drwxr-xr-x  2 root root  4096 Oct 31 10:42 .</text>
<text x="393" y="554" font-family="Menlo, monospace" font-size="13" fill="#99a5a3">drwxr-xr-x  1 root root  4096 Oct 31 10:40 ..</text>
<text x="393" y="578" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7">-rw-r--r--  1 root root   124 Oct 31 10:42 README.md</text>
<text x="393" y="602" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7">-rwxr-xr-x  1 root root    67 Oct 31 10:42 hello.py</text>
<text x="393" y="626" font-family="Menlo, monospace" font-size="13" fill="#e5e9e7"></text>
<text x="393" y="650" font-family="Menlo, monospace" font-size="13" fill="#b3ebbc">root@sandbox:/workspace# python3 hello.py</text>
