      tags:
      - sessions
  /api/v1/sandboxes/{id}/sessions/{session_id}/exec:
    post:
      consumes:
      - application/json
      description: Writes the command to the session shell and waits for it to finish.
        A session runs one command at a time. If the command times out the session
        is terminated, because its shell state is no longer known.
      parameters:
      - description: Sandbox ID.
        in: path
        name: id
        required: true
        type: string
      - description: Session ID.
        in: path
        name: session_id
        required: true
        type: string
      - description: Command to run.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/presentation.SessionExecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Command finished.
          schema:
            $ref: '#/definitions/presentation.ExecEnvelopeDoc'
        "400":
