  /api/v1/sandboxes/{id}/sessions:
    get:
      parameters:
      - description: Sandbox ID.
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sessions ordered by creation time.
          schema:
            $ref: '#/definitions/presentation.SessionListEnvelopeDoc'
        "401":
          description: Missing or invalid API key.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Sandbox not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: List shell sessions
      tags:
      - sessions
    post:
      consumes:
      - application/json
      description: Starts a long-lived shell inside the sandbox. Commands sent to
        the session share shell state -- working directory, exported variables, activated
        virtualenvs -- across calls.
      parameters:
      - description: Sandbox ID.
        in: path
        name: id
        required: true
