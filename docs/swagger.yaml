            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Open an isolated HTTP and WebSocket app preview
      tags:
      - previews
  /sandboxes/{id}/snapshot-policy:
    put:
      consumes:
      - application/json
      parameters:
      - description: Sandbox ID
        in: path
        name: id
        required: true
        type: string
      - description: Backup policy; zero interval disables scheduled backups
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SnapshotPolicy'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presentation.SandboxEnvelopeDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Configure scheduled and pre-expiry backups
      tags:
      - snapshots
  /snapshots/progress:
    get:
      description: Reports the progress of every backup and restore running on this
        host, read from memory alone. Listing snapshots fetches each manifest from
        cloud storage and is far too expensive to poll at the rate a progress bar
        wants; this is not. Jobs disappear from the list when they finish, and a host
        restart leaves none behind.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presentation.SnapshotJobsEnvelopeDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: List running backups and restores
      tags:
      - snapshots
schemes:
- http
- https
