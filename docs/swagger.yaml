- description: One-shot command execution, buffered or streamed over Server-Sent Events.
  name: exec
- description: Persistent shell sessions whose state carries across commands.
  name: sessions
- description: File upload, download, listing, and management inside a sandbox.
  name: files
- description: Save-and-stop filesystem backups in S3-compatible storage and restore
    into new sandboxes.
  name: snapshots
