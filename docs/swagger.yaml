      responses:
        "201":
          description: The image that was created.
          schema:
            $ref: '#/definitions/presentation.ImageEnvelopeDoc'
        "400":
          description: Invalid request body, unusable image name, or a snapshot from
            another architecture or format.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "401":
          description: Missing or invalid API key.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Snapshot not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
