        "401":
          description: Missing or invalid API key.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Sandbox or session not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
          description: Sandbox not running, session busy (session_busy), or session
            closed (session_closed).
