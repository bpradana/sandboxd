          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "429":
          description: Maximum concurrent snapshot operations reached.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "503":
          description: Filesystem snapshots are disabled.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Import a snapshot as a base image
      tags:
      - snapshots
