        operations use the connection.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presentation.EmptyEnvelopeDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Disconnect cloud storage and forget saved credentials
      tags:
      - snapshots
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presentation.CloudStorageEnvelopeDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Get cloud storage connection settings without credentials
      tags:
      - snapshots
    put:
      consumes:
      - application/json
      description: Takes effect immediately and survives daemon restarts. Refused
        while snapshot operations use the current connection. Saved settings take
