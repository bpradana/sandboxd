          $ref: '#/definitions/presentation.KeepaliveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated sandbox.
          schema:
            $ref: '#/definitions/presentation.SandboxEnvelopeDoc'
        "400":
          description: Validation failed.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "401":
          description: Missing or invalid API key.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Sandbox not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
