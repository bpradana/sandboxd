  /api/v1/snapshots/{id}/image:
    post:
      consumes:
      - application/json
      description: 'Turns a ready snapshot into a base image that later sandboxes
        can start from, so prepared work (installed packages, checked-out source)
        costs nothing per start instead of being installed again every time. The archive
        is downloaded and extracted the way a restore extracts it: ownership shifted
        into the sandbox id range, setuid bits stripped, device nodes skipped. The
        snapshot must have been taken on this architecture, and the image name must
        be free.'
