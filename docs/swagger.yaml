      - application/json
      responses:
        "200":
          description: Resource statistics.
          schema:
            $ref: '#/definitions/presentation.SandboxStatsEnvelopeDoc'
        "401":
          description: Missing or invalid API key.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Sandbox not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
          description: Sandbox is not running (sandbox_not_running).
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Get sandbox resource statistics
      tags:
      - sandboxes
  /api/v1/sandboxes/{id}/terminal:
    get:
      description: 'Upgrades to a WebSocket attached to a login shell on a pseudo-terminal
        inside the sandbox: a new one, or with terminal_id a running one (recent output
        is replayed). Binary messages carry raw terminal input (client to server)
        and output (server to client). Text messages carry JSON control messages:
        the server first sends {"type":"attached","terminal_id":"..."}; the client
        sends {"type":"resize","cols":N,"rows":N} and {"type":"close"} to end the
        terminal; the server sends {"type":"exit","exit_code":N} or {"type":"error","error":"..."}
        before closing. Closing the socket without "close" detaches: the shell keeps
        running for SANDBOX_TERMINAL_DETACH_TIMEOUT and can be reattached; a newer
        attachment takes over from an older one. Authenticate with a bearer key or
        with a ticket from POST /terminal/tickets; browser Origins must be this server
        or an allowed CORS origin. While attached, the terminal keeps the sandbox
        from going idle.'
      parameters:
      - description: Sandbox ID.
        in: path
        name: id
        required: true
        type: string
      - description: Single-use terminal ticket.
        in: query
        name: ticket
        type: string
      - description: Reattach to this running terminal.
        in: query
        name: terminal_id
        type: string
      - description: Initial columns.
        in: query
        maximum: 1000
        minimum: 1
        name: cols
        type: integer
      - description: Initial rows.
        in: query
        maximum: 1000
        minimum: 1
        name: rows
        type: integer
      - description: Login shell; bash falls back to sh when absent.
        enum:
        - sh
        - bash
        in: query
        name: shell
        type: string
      - description: Initial working directory.
        in: query
        name: cwd
        type: string
      responses:
        "101":
          description: Switching to the WebSocket protocol.
          schema:
            $ref: '#/definitions/presentation.TerminalControlMessage'
        "400":
          description: Validation failed.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "401":
          description: Missing or invalid API key or ticket.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "403":
          description: Origin not allowed.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Sandbox not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
          description: Sandbox is not running.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "426":
          description: Not a WebSocket upgrade request.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Open an interactive terminal
      tags:
      - terminal
  /api/v1/sandboxes/{id}/terminal/tickets:
    post:
      description: Returns a single-use ticket, valid for 30 seconds, that authenticates
        one WebSocket upgrade on GET /api/v1/sandboxes/{id}/terminal. Browsers need
        it because they cannot send an Authorization header on a WebSocket.
      parameters:
      - description: Sandbox ID.
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Ticket issued.
          schema:
            $ref: '#/definitions/presentation.TerminalTicketEnvelopeDoc'
        "401":
          description: Missing or invalid API key.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "404":
          description: Sandbox not found.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
        "409":
          description: Sandbox is not running.
          schema:
            $ref: '#/definitions/presentation.ErrorResponseDoc'
      security:
      - BearerAuth: []
      summary: Issue a terminal ticket
      tags:
      - terminal
  /api/v1/settings/cloud-storage:
